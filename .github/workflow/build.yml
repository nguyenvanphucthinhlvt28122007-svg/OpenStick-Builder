name: Build OpenStick Image

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo docker image prune --all --force
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Docker image
        run: |
          docker build --tag openstick .

      - name: Create output directory
        run: |
          mkdir -p output

      - name: Compile Kernel (1_kernel.sh)
        run: |
          docker run --privileged -v $(pwd)/config:/config:ro -v $(pwd)/output:/output openstick /bin/bash /config/1_kernel.sh

      - name: Debootstrap Rootfs (2_rootfs.sh)
        run: |
          docker run --privileged -v $(pwd)/config:/config:ro -v $(pwd)/output:/output openstick /bin/bash /config/2_rootfs.sh

      - name: Provision Image (3_provision.sh)
        run: |
          docker run --privileged -v $(pwd)/config:/config:ro -v $(pwd)/output:/output openstick /bin/bash /config/3_provision.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openstick-build-artifacts
          path: |
            output/boot.img
            output/rootfs.img
            output/rootfs.ext4
          if-no-files-found: error
